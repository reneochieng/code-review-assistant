[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-assistant"
version = "0.1.0"
description = "A static-analysis tool that reviews Python code for bugs, style smells, and complexity, and emits structured feedback."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rene Ochieng" }]
keywords = ["static-analysis", "linter", "code-review", "ast", "cyclomatic-complexity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
code-review = "code_review_assistant.cli:main"

[project.urls]
Homepage = "https://github.com/reneochieng/code-review-assistant"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
